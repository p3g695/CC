<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CC - 3D Animation Studio</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      overflow: hidden;
    }

    /* Welcome / Homepage Overlay */
    #welcome-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.4s ease, visibility 0.4s;
    }

    #welcome-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    #welcome-screen h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
      color: #60a5fa;
    }

    #welcome-screen p {
      font-size: 1.1rem;
      color: #9ca3af;
      margin-bottom: 30px;
      max-width: 500px;
      text-align: center;
    }

    .btn-container {
      display: flex;
      gap: 15px;
    }

    .btn {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    .btn-secondary {
      background-color: #374151;
      color: white;
    }

    .btn-secondary:hover {
      background-color: #4b5563;
    }

    /* Workspace Main Layout */
    #workspace {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    #main-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left Toolbar */
    #toolbar {
      width: 65px;
      background-color: #262626;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 15px;
      gap: 12px;
      z-index: 10;
    }

    .tool-icon {
      width: 45px;
      height: 45px;
      background-color: #333;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 0.75rem;
      user-select: none;
      transition: background 0.2s;
    }

    .tool-icon:hover {
      background-color: #383838;
    }

    .tool-icon.active {
      background-color: #2563eb;
      color: #fff;
    }

    /* Center 3D Viewport */
    #viewport-container {
      flex: 1;
      position: relative;
      background-color: #121212;
    }

    #viewport-container canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #viewport-overlay-info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      pointer-events: none;
    }

    /* Right Inspector Panel */
    #inspector {
      width: 280px;
      background-color: #222222;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
      padding: 15px;
      z-index: 10;
    }

    #inspector h2 {
      font-size: 1rem;
      margin-bottom: 10px;
      color: #e5e7eb;
      border-bottom: 1px solid #444;
      padding-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .outliner-list {
      list-style: none;
      margin-bottom: 20px;
    }

    .outliner-item {
      padding: 8px 10px;
      margin-bottom: 4px;
      background-color: #2d2d2d;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .outliner-item:hover, .outliner-item.selected {
      border-color: #2563eb;
      background-color: #383838;
    }

    .type-badge {
      font-size: 0.7rem;
      background-color: #4b5563;
      padding: 2px 6px;
      border-radius: 3px;
      color: #d1d5db;
    }

    .property-box {
      background-color: #1a1a1a;
      padding: 10px;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .property-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      color: #aaa;
    }

    .property-value {
      color: #fff;
      font-family: monospace;
    }

    /* Bottom Timeline Panel */
    #timeline-panel {
      height: 150px;
      background-color: #1e1e1e;
      border-top: 1px solid #333;
      display: flex;
      flex-direction: column;
      z-index: 20;
      transition: height 0.3s ease;
    }

    #timeline-panel.collapsed {
      height: 0px;
      overflow: hidden;
      border-top: none;
    }
